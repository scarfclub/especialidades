<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Especialidades | Scarf Club</title>
<meta name="description" content="Apresentações de especialidades do Clube de Desbravadores Scarf Club, para instrutores e desbravadores.">
<meta name="theme-color" content="#09090C">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23FFD400'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#09090C; --card:#15151B; --card2:#1C1C24; --line:rgba(255,255,255,.09);
  --tx:#F5F5F2; --mu:#9C9CA6; --y:#FFD400; --ac:#FFD400;
  --display:"Anton","Impact","Arial Narrow",sans-serif;
  --body:"Space Grotesk","Segoe UI",system-ui,sans-serif;
  --pad:max(20px, calc((100vw - 1240px) / 2 + 32px));
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--body);color:var(--tx);background:var(--bg);-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(rgba(255,255,255,.045) 1px,transparent 1px);background-size:26px 26px}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--y);outline-offset:3px;border-radius:8px}

/* ---------- barra do topo ---------- */
.nav{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:14px var(--pad);background:rgba(9,9,12,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav img{width:112px}
.find{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 10px 9px 16px;color:var(--mu);font-size:15px;min-width:260px;transition:border-color .2s}
.find:hover{border-color:rgba(255,255,255,.25)}
.find svg{width:18px;height:18px}
.find span{flex:1;text-align:left}
kbd{font-family:var(--body);font-size:12px;font-weight:600;color:var(--tx);background:var(--card2);border:1px solid var(--line);border-bottom-width:3px;border-radius:7px;padding:2px 8px;min-width:26px;text-align:center;display:inline-block}

/* ---------- destaque ---------- */
.hero{position:relative;overflow:hidden}
.hero-in{position:relative;display:grid;grid-template-columns:1.15fr 1fr;gap:40px;align-items:center;padding:56px var(--pad) 80px}
.glow{position:absolute;right:-12%;top:-20%;width:760px;height:760px;border-radius:50%;background:radial-gradient(circle,var(--ac),transparent 62%);opacity:.22;filter:blur(30px);pointer-events:none}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mu)}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--y);color:#000;border-radius:999px;padding:5px 12px;letter-spacing:.08em}
.pill i{width:8px;height:8px;border-radius:50%;background:#000;animation:pulse 1.6s infinite}
.hero h1{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:clamp(52px,8.4vw,128px);line-height:.95;margin:22px 0 0;letter-spacing:.005em}
.hero .sub{font-size:18px;color:var(--mu);line-height:1.6;margin:20px 0 0;max-width:520px}
.hero .sub b{color:var(--tx);font-weight:600}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px}
.btn{display:inline-flex;align-items:center;gap:9px;border:1px solid transparent;border-radius:999px;font-size:15px;font-weight:600;padding:12px 20px;transition:transform .2s,background .2s,border-color .2s}
.btn svg{width:18px;height:18px;flex:none}
.btn.main{background:var(--y);color:#000}
.btn.main:hover{transform:translateY(-2px);background:#fff}
.btn.sec{background:transparent;border-color:var(--line);color:var(--tx)}
.btn.sec:hover{border-color:rgba(255,255,255,.35)}

.badge{position:relative;width:min(440px,100%);aspect-ratio:1;margin:0 auto}
.badge .ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,var(--y),#fff 25%,var(--y) 50%,rgba(255,255,255,.15) 75%,var(--y));
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 calc(100% - 6px));mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 calc(100% - 6px));animation:spin 14s linear infinite}
.badge .dash{position:absolute;inset:20px;border-radius:50%;border:2px dashed rgba(255,255,255,.16);animation:spin 40s linear infinite reverse}
.badge .disc{position:absolute;inset:38px;border-radius:50%;background:radial-gradient(circle at 32% 26%,#2C2C36,#0F0F14 70%);box-shadow:inset 0 0 0 1px var(--line)}
.badge img{position:absolute;left:50%;bottom:16%;width:86%;height:94%;object-fit:contain;object-position:bottom;transform:translateX(-50%);filter:drop-shadow(0 22px 28px rgba(0,0,0,.55));animation:float 5s ease-in-out infinite}
.badge .ini{position:absolute;inset:38px;display:grid;place-items:center;font-family:var(--display);font-size:180px;color:var(--ac)}

/* ---------- números ---------- */
.stats{display:flex;flex-wrap:wrap;gap:12px 40px;padding:22px var(--pad);border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:rgba(255,255,255,.015)}
.stat{display:flex;align-items:baseline;gap:10px;color:var(--mu);font-size:15px}
.stat b{font-family:var(--display);font-weight:400;font-size:34px;color:var(--tx);line-height:1}

/* ---------- filtros ---------- */
.filters{display:flex;gap:10px;overflow-x:auto;padding:36px var(--pad) 8px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);padding:9px 16px;border-radius:999px;font-size:15px;font-weight:500;transition:background .2s,border-color .2s,color .2s}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c,var(--y))}
.chip:hover{border-color:rgba(255,255,255,.3)}
.chip[aria-pressed="true"]{background:var(--tx);color:#000;border-color:var(--tx)}

/* ---------- trilhas por área ---------- */
.row{padding-top:40px}
.row-h{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 var(--pad);margin-bottom:6px}
.row-h h2{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:600;margin:0}
.row-h h2 i{width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 16px var(--c)}
.row-h h2 small{font-size:15px;font-weight:500;color:var(--mu)}
.arrows{display:flex;gap:8px}
.arrows button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;transition:border-color .2s}
.arrows button:hover{border-color:rgba(255,255,255,.35)}
.arrows svg{width:18px;height:18px}
.track{display:grid;grid-auto-flow:column;grid-auto-columns:224px;gap:22px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 var(--pad);padding:18px var(--pad) 28px;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}

.ins{scroll-snap-align:start;display:flex;flex-direction:column;opacity:0;transform:translateY(16px);animation:in .5s forwards;animation-delay:calc(var(--i) * 60ms)}
.medal{position:relative;display:block;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 32% 26%,var(--card2),var(--card) 70%);box-shadow:inset 0 0 0 3px var(--c);transition:transform .3s,box-shadow .3s}
.medal::before{content:"";position:absolute;inset:-9px;border-radius:50%;border:2px dashed var(--c);opacity:0;transition:opacity .3s}
.medal img{position:absolute;inset:11%;width:78%;height:78%;object-fit:contain;filter:drop-shadow(0 10px 14px rgba(0,0,0,.45));transition:transform .35s}
.medal .ini{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:96px;color:var(--c)}
.ins:hover .medal{transform:translateY(-6px);box-shadow:inset 0 0 0 3px var(--c),0 18px 40px -12px var(--c)}
.ins:hover .medal::before{opacity:.7;animation:spin 8s linear infinite}
.ins:hover .medal img{transform:scale(1.08)}
.new{position:absolute;top:6px;right:6px;z-index:1;background:var(--y);color:#000;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:4px 10px}
.ins h3{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:27px;line-height:1.05;margin:18px 0 0;text-align:center}
.ins .meta{font-size:14px;color:var(--mu);margin:6px 0 0;text-align:center}
.mini{display:flex;justify-content:center;gap:6px;margin-top:12px}
.mini a,.mini button{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--card);transition:background .2s,color .2s,border-color .2s}
.mini a:first-child{background:var(--tx);color:#000;border-color:var(--tx)}
.mini a:hover,.mini button:hover{background:var(--y);color:#000;border-color:var(--y)}
.mini svg{width:17px;height:17px}
.soon .medal{box-shadow:inset 0 0 0 2px var(--line)}
.soon .medal img{filter:grayscale(1);opacity:.35}
.soon .tag{text-align:center;font-size:14px;font-weight:600;color:var(--mu);margin-top:8px}

.empty{display:none;padding:56px var(--pad);font-size:18px;color:var(--mu)}
.empty button{border:0;background:none;padding:0;font-weight:600;color:var(--y);text-decoration:underline}

/* ---------- rodapé ---------- */
footer{margin-top:64px;border-top:1px solid var(--line)}
.foot{display:grid;grid-template-columns:auto 1fr;gap:28px 56px;align-items:center;padding:48px var(--pad)}
.foot img{width:120px}
.foot h4{margin:0 0 14px;font-size:18px;font-weight:600}
.foot p{margin:0 0 16px;color:var(--mu);line-height:1.6}
.keys{display:flex;flex-wrap:wrap;gap:10px 24px;color:var(--mu);font-size:15px}
.keys span{display:inline-flex;align-items:center;gap:8px}
.foot .by{grid-column:1/-1;font-size:14px;color:var(--mu);border-top:1px solid var(--line);padding-top:24px}

/* ---------- busca rápida (⌘K) ---------- */
.cmd{position:fixed;inset:0;z-index:50;display:none;align-items:flex-start;justify-content:center;padding:12vh 16px 16px;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.cmd.on{display:flex}
.box{width:min(620px,100%);background:#111116;border:1px solid var(--line);border-radius:22px;box-shadow:0 40px 80px -20px rgba(0,0,0,.8);overflow:hidden;animation:pop .2s ease-out}
.box label{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}
.box label svg{width:20px;height:20px;color:var(--mu)}
.box input{flex:1;border:0;background:none;color:var(--tx);font:inherit;font-size:19px;outline:none}
.res{list-style:none;margin:0;padding:8px;max-height:52vh;overflow:auto}
.res li a{display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:14px}
.res li a[aria-selected="true"]{background:var(--card2)}
.res .th{width:46px;height:46px;border-radius:50%;flex:none;background:var(--card);box-shadow:inset 0 0 0 2px var(--c);display:grid;place-items:center;overflow:hidden;font-family:var(--display);font-size:22px;color:var(--c)}
.res .th img{width:80%;height:80%;object-fit:contain}
.res b{display:block;font-weight:600}
.res small{color:var(--mu)}
.res .go{margin-left:auto;color:var(--mu);font-size:13px}
.res .none{padding:24px 12px;color:var(--mu)}
.box footer{margin:0;padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:18px;font-size:13px;color:var(--mu)}

.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,120px);visibility:hidden;background:var(--y);color:#000;padding:12px 22px;border-radius:999px;font-size:15px;font-weight:600;transition:transform .3s;z-index:60}
.toast.on{transform:translate(-50%,0);visibility:visible}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{50%{transform:translateX(-50%) translateY(-12px)}}
@keyframes pulse{50%{opacity:.25}}
@keyframes in{to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(-8px) scale(.98)}}

@media (max-width:860px){
  .hero-in{grid-template-columns:1fr;padding-top:32px;padding-bottom:48px}
  .badge{width:min(320px,86%);order:-1}
  .find{min-width:0}
  .find span,.find kbd{display:none}
  .track{grid-auto-columns:170px;gap:16px}
  .ins h3{font-size:22px}
  .arrows{display:none}
  .foot{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}.ins{opacity:1;transform:none}}
</style>
</head>
<body>

<nav class="nav">
  <a href="#"><img src="logo/logo_claro.webp" alt="Scarf Club"></a>
  <button class="find" id="openFind" aria-label="Buscar especialidade">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <span>Buscar especialidade</span><kbd>/</kbd>
  </button>
</nav>

<header class="hero" id="hero">
  <div class="glow"></div>
  <div class="hero-in">
    <div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="heroTitle">Especialidades</h1>
      <p class="sub" id="heroSub"></p>
      <div class="acts" id="heroActs"></div>
    </div>
    <a class="badge" id="badge" aria-label="Abrir a especialidade mais recente"></a>
  </div>
</header>

<section class="stats" id="stats" aria-label="Números"></section>

<main>
  <div class="filters" id="chips" role="group" aria-label="Filtrar por área"></div>
  <div id="rows"></div>
  <p class="empty" id="empty">Nenhuma especialidade nessa área. <button id="clear">Ver todas</button></p>
</main>

<footer>
  <div class="foot">
    <img src="logo/logo_claro.webp" alt="Scarf Club">
    <div>
      <h4>Vai dar instrução sem internet?</h4>
      <p>Toque em <b>Baixar</b> antes e abra o arquivo no navegador. Durante a aula:</p>
      <div class="keys">
        <span><kbd>Espaço</kbd> revela a resposta</span>
        <span><kbd>←</kbd><kbd>→</kbd> trocam de slide</span>
        <span><kbd>F</kbd> tela cheia</span>
      </div>
    </div>
    <p class="by">Scarf Club · Instrutor: Jônatas Samuel</p>
  </div>
</footer>

<div class="cmd" id="cmd" role="dialog" aria-modal="true" aria-label="Buscar especialidade">
  <div class="box">
    <label>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="q" type="search" placeholder="Qual especialidade?" autocomplete="off" aria-controls="res">
      <kbd>Esc</kbd>
    </label>
    <ul class="res" id="res" role="listbox"></ul>
    <footer><span><kbd>↑</kbd><kbd>↓</kbd> navegar</span><span><kbd>Enter</kbd> abrir</span></footer>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ==============================================================
   LISTA DE ESPECIALIDADES
   Para adicionar uma nova, copie um bloco { ... }, cole abaixo e
   troque os dados. A página se atualiza sozinha: trilhas por área,
   filtros, números, busca e o destaque do topo (a mais recente).

   nome       nome que aparece na página
   area       área da especialidade (vira trilha e filtro sozinha)
   arquivo    caminho do HTML dentro da pasta "especialidades"
   capa       imagem da insígnia na pasta "capas" (opcional;
              sem ela aparece a inicial do nome)
   requisitos quantidade de requisitos (opcional)
   data       data de publicação, no formato AAAA-MM-DD
   emBreve    true = aparece como "Em breve", sem link
   ============================================================== */
const ESPECIALIDADES = [
  { nome: "Sementes", area: "Estudos da Natureza", arquivo: "especialidades/especialidade-de-sementes.html", capa: "capas/sementes.webp", requisitos: 10, data: "2026-09-19" },
  { nome: "Cães", area: "Estudos da Natureza", arquivo: "especialidades/especialidade-de-caes.html", capa: "capas/caes.webp", requisitos: 13, data: "2026-09-19" },
  { nome: "Mamíferos", area: "Estudos da Natureza", arquivo: "especialidades/especialidade-de-mamiferos.html", capa: "capas/mamiferos.png", requisitos: 7, data: "2026-10-03" },
  { nome: "Anfíbios", area: "Estudos da Natureza", arquivo: "especialidades/especialidade-de-anfibios.html", capa: "capas/anfibios.png", requisitos: 10, data: "2026-10-08" },
  { nome: "Répteis", area: "Estudos da Natureza", arquivo: "especialidades/especialidade-de-repteis.html", capa: "capas/repteis.png", requisitos: 8, data: "2026-10-08" },
  { nome: "Cactos", area: "Estudos da Natureza", arquivo: "especialidades/especialidade-de-cactos.html", capa: "capas/cactos.png", requisitos: 9, data: "2026-10-09" },
  { nome: "Árvores", area: "Estudos da Natureza", arquivo: "especialidades/especialidade-de-arvores.html", capa: "capas/arvores.png", requisitos: 10, data: "2026-10-10" },
  { nome: "Arbustos", area: "Estudos da Natureza", arquivo: "especialidades/especialidade-de-arbustos.html", capa: "capas/arbustos.png", requisitos: 9, data: "2026-10-10" },
  { nome: "Flores", area: "Estudos da Natureza", arquivo: "especialidades/especialidade-de-flores.html", capa: "capas/flores.png", requisitos: 10, data: "2026-10-10" },
  { nome: "Acampamento I", area: "Atividades Recreativas", arquivo: "especialidades/especialidade-de-acampamento-i.html", capa: "capas/acampamentoI.png", requisitos: 9, data: "2026-10-16" },
  { nome: "Primeiros Socorros - Básico", area: "Ciência e Saúde", arquivo: "especialidades/especialidade-primeiros-socorros-basico.html", capa: "capas/primeiros-socorros-basico.png", requisitos: 16, data: "2026-10-19" },

  // Modelo para a próxima (apague as barras // do começo das linhas):
  // { nome: "Aves", area: "Estudos da Natureza", arquivo: "especialidades/especialidade-de-aves.html", capa: "capas/aves.png", requisitos: 10, data: "2026-10-25" },

  // Para anunciar uma que ainda está em preparo:
  // { nome: "Aves", area: "Estudos da Natureza", emBreve: true },
];

/* Quantos dias um item continua com a marca "Nova" */
const DIAS_NOVIDADE = 30;

/* ==============================================================
   Daqui para baixo não precisa mexer.
   ============================================================== */

const $ = id => document.getElementById(id);
const u = p => p;
const norm = s => (s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const inicial = n => (n||"?").trim().charAt(0).toUpperCase();
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hoje = new Date();
const ehNova = e => e.data && !e.emBreve && (hoje - new Date(e.data+"T12:00")) / 864e5 <= DIAS_NOVIDADE;
const areas = [...new Set(ESPECIALIDADES.map(e => e.area).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"pt-BR"));
const cor = () => "#FFD400"; /* paleta do clube: preto, branco e amarelo */
const prontas = ESPECIALIDADES.filter(e => !e.emBreve);
const lista = [...ESPECIALIDADES].sort((a,b) => (a.emBreve?1:0)-(b.emBreve?1:0) || a.nome.localeCompare(b.nome,"pt-BR"));
const ICON = {
  play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l10.5-6.5z"/></svg>',
  down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/></svg>',
  link:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1 1"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1-1"/></svg>',
  left:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  right:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>'
};

/* destaque: a publicada mais recente */
const recente = [...prontas].sort((a,b) => (b.data||"").localeCompare(a.data||""))[0];
if (recente) {
  $("hero").style.setProperty("--ac", cor(recente.area));
  $("eyebrow").innerHTML = `<span class="pill"><i></i>${ehNova(recente) ? "Nova" : "Mais recente"}</span>${esc(recente.area||"")}`;
  $("heroTitle").textContent = recente.nome;
  $("heroSub").innerHTML = `${recente.requisitos ? `<b>${recente.requisitos} requisitos</b>, ` : ""}respostas reveladas no clique e quiz no final. Pronta para a sua próxima instrução.`;
  $("heroActs").innerHTML = `
    <a class="btn main" href="${esc(u(recente.arquivo))}">${ICON.play}Apresentar agora</a>
    <a class="btn sec" href="${esc(u(recente.arquivo))}" download="${esc(recente.arquivo.split("/").pop())}">${ICON.down}Baixar</a>`;
  $("badge").href = u(recente.arquivo);
  $("badge").innerHTML = `<div class="ring"></div><div class="dash"></div><div class="disc"></div>` +
    (recente.capa ? `<img src="${esc(u(recente.capa))}" alt="">` : `<div class="ini">${inicial(recente.nome)}</div>`);
}

/* números */
const totalReq = prontas.reduce((s,e) => s + (e.requisitos||0), 0);
$("stats").innerHTML = `
  <span class="stat"><b>${prontas.length}</b>especialidades prontas</span>
  <span class="stat"><b>${areas.length}</b>${areas.length===1?"área":"áreas"}</span>
  <span class="stat"><b>${totalReq}</b>requisitos cobertos</span>`;

/* filtros */
let areaAtiva = "";
function chips(){
  $("chips").innerHTML = ["", ...areas].map(a =>
    `<button class="chip" data-a="${esc(a)}" aria-pressed="${a===areaAtiva}" style="--c:${a?cor(a):"#FFD400"}"><i></i>${a ? esc(a) : "Todas"}</button>`).join("");
}
$("chips").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  areaAtiva = b.dataset.a; chips(); render();
});

/* trilhas */
function card(e, i){
  const pic = e.capa ? `<img src="${esc(u(e.capa))}" alt="" loading="lazy">` : `<span class="ini">${inicial(e.nome)}</span>`;
  if (e.emBreve) return `
    <article class="ins soon" style="--i:${i};--c:${cor(e.area)}">
      <div class="medal">${pic}</div><h3>${esc(e.nome)}</h3><p class="tag">Em breve</p>
    </article>`;
  return `
    <article class="ins" style="--i:${i};--c:${cor(e.area)}">
      <a class="medal" href="${esc(u(e.arquivo))}" aria-label="Apresentar ${esc(e.nome)}">${ehNova(e) ? '<span class="new">Nova</span>' : ""}${pic}</a>
      <h3>${esc(e.nome)}</h3>
      <p class="meta">${e.requisitos ? e.requisitos + " requisitos · " : ""}quiz</p>
      <div class="mini">
        <a href="${esc(u(e.arquivo))}" title="Apresentar" aria-label="Apresentar ${esc(e.nome)}">${ICON.play}</a>
        <a href="${esc(u(e.arquivo))}" download="${esc(e.arquivo.split("/").pop())}" title="Baixar" aria-label="Baixar ${esc(e.nome)}">${ICON.down}</a>
        <button data-link="${esc(u(e.arquivo))}" title="Copiar link" aria-label="Copiar o link de ${esc(e.nome)}">${ICON.link}</button>
      </div>
    </article>`;
}
function render(){
  const mostrar = areaAtiva ? [areaAtiva] : areas;
  let html = "", total = 0;
  mostrar.forEach(a => {
    const itens = lista.filter(e => e.area === a);
    if (!itens.length) return;
    total += itens.length;
    html += `
      <section class="row" style="--c:${cor(a)}">
        <div class="row-h">
          <h2><i></i>${esc(a)} <small>${itens.length}</small></h2>
          <div class="arrows"><button data-dir="-1" aria-label="Voltar">${ICON.left}</button><button data-dir="1" aria-label="Avançar">${ICON.right}</button></div>
        </div>
        <div class="track">${itens.map(card).join("")}</div>
      </section>`;
  });
  $("rows").innerHTML = html;
  $("empty").style.display = total ? "none" : "block";
}
$("rows").addEventListener("click", async e => {
  const arrow = e.target.closest("[data-dir]");
  if (arrow) { const t = arrow.closest(".row").querySelector(".track"); t.scrollBy({left: t.clientWidth * .8 * arrow.dataset.dir, behavior:"smooth"}); return; }
  const b = e.target.closest("[data-link]"); if (!b) return;
  const url = new URL(b.dataset.link, location.href).href;
  try { await navigator.clipboard.writeText(url); aviso("Link copiado"); } catch { prompt("Copie o link:", url); }
});
$("clear").onclick = () => { areaAtiva = ""; chips(); render(); };

/* busca rápida */
let sel = 0, achados = [];
function abrir(){ $("cmd").classList.add("on"); $("q").value = ""; busca(); setTimeout(() => $("q").focus(), 10); }
function fechar(){ $("cmd").classList.remove("on"); }
function busca(){
  const q = norm($("q").value);
  achados = prontas.filter(e => !q || norm(e.nome + " " + e.area).includes(q)).sort((a,b)=>a.nome.localeCompare(b.nome,"pt-BR"));
  sel = 0; pinta();
}
function pinta(){
  $("res").innerHTML = achados.length ? achados.map((e,i) => `
    <li><a href="${esc(u(e.arquivo))}" role="option" aria-selected="${i===sel}" style="--c:${cor(e.area)}">
      <span class="th">${e.capa ? `<img src="${esc(u(e.capa))}" alt="">` : inicial(e.nome)}</span>
      <span><b>${esc(e.nome)}</b><small>${esc(e.area||"")}</small></span>
      <span class="go">Apresentar ↵</span>
    </a></li>`).join("") : `<li class="none">Nenhuma especialidade com esse nome.</li>`;
  const s = $("res").querySelector('[aria-selected="true"]'); if (s) s.scrollIntoView({block:"nearest"});
}
$("openFind").onclick = abrir;
$("q").addEventListener("input", busca);
$("cmd").addEventListener("click", e => { if (e.target.id === "cmd") fechar(); });
document.addEventListener("keydown", e => {
  const aberto = $("cmd").classList.contains("on");
  if (!aberto && (e.key === "/" || ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k"))) {
    if (/input|textarea/i.test(document.activeElement.tagName)) return;
    e.preventDefault(); abrir(); return;
  }
  if (!aberto) return;
  if (e.key === "Escape") fechar();
  else if (e.key === "ArrowDown") { e.preventDefault(); sel = Math.min(sel+1, achados.length-1); pinta(); }
  else if (e.key === "ArrowUp") { e.preventDefault(); sel = Math.max(sel-1, 0); pinta(); }
  else if (e.key === "Enter" && achados[sel]) { location.href = u(achados[sel].arquivo); }
});

let t;
function aviso(msg){ const el = $("toast"); el.textContent = msg; el.classList.add("on"); clearTimeout(t); t = setTimeout(()=>el.classList.remove("on"), 2200); }

chips(); render();
</script>
</body>
</html>
